name: 🚀 CI/CD Pipeline — Build, Test, Dockerize & Deploy to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/food-app
  K8S_NAMESPACE: food-app
  K8S_DEPLOYMENT: food-app

jobs:
  # =====================================================
  # JOB 1 -- BUILD & TEST (source files)
  # =====================================================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          echo "Checking required project files..."
          MISSING=0
          files=(
            "index.html" "css/style.css" "css/home.css"
            "js/app.js" "js/home.js" "data/restaurants.js"
            "pages/menu.html" "pages/login.html" "pages/cart.html"
            "pages/orders.html" "pages/tracking.html" "pages/admin.html"
            "pages/statistics.html" "pages/restaurant-dashboard.html"
            "pages/delivery-dashboard.html"
          )
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then echo "  OK $file"
            else echo "  MISSING: $file"; MISSING=$((MISSING+1)); fi
          done
          [ $MISSING -eq 0 ] || { echo "$MISSING file(s) missing"; exit 1; }
          echo "All required files present"

      - name: Test -- HTML structure
        run: |
          ERRORS=0
          for f in $(find . -name "*.html" -not -path "./.git/*"); do
            label="${f#./}"
            [ -s "$f" ]          || { echo "FAIL empty: $label";      ERRORS=$((ERRORS+1)); continue; }
            grep -qi "<html" "$f" || { echo "FAIL no <html>: $label"; ERRORS=$((ERRORS+1)); continue; }
            grep -qi "<body" "$f" || { echo "FAIL no <body>: $label"; ERRORS=$((ERRORS+1)); continue; }
            echo "  PASS: $label"
          done
          [ $ERRORS -eq 0 ] || { echo "$ERRORS HTML test(s) failed"; exit 1; }
          echo "All HTML tests passed"

      - name: Test -- JS syntax
        run: |
          ERRORS=0
          for f in js/*.js data/*.js; do
            node --check "$f" 2>/dev/null && echo "  PASS: $f" || { echo "  FAIL: $f"; ERRORS=$((ERRORS+1)); }
          done
          [ $ERRORS -eq 0 ] || { echo "$ERRORS JS error(s)"; exit 1; }
          echo "All JS tests passed"

      - name: Test -- CSS non-empty
        run: |
          for f in $(find . -name "*.css" -not -path "./.git/*"); do
            [ -s "$f" ] && echo "  PASS: ${f#./}" || { echo "  FAIL empty: $f"; exit 1; }
          done
          echo "All CSS tests passed"

  # =====================================================
  # JOB 2 -- DOCKER BUILD & PUSH
  # Builds image and pushes to Docker Hub
  # Image tagged with both git SHA and "latest"
  # =====================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "Image pushed:"
          echo "${{ steps.meta.outputs.tags }}"

  # =====================================================
  # JOB 3 -- DEPLOY TO KUBERNETES
  # Updates the deployment image and waits for rollout
  # =====================================================
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubectl (AWS EKS)
        # If using EKS — comment out if using a different cluster
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Uncomment below if using a generic kubeconfig instead of EKS:
      # - name: Configure kubectl (generic)
      #   run: |
      #     mkdir -p ~/.kube
      #     echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
      #     chmod 600 ~/.kube/config

      - name: Apply Kubernetes manifests
        run: |
          echo "Applying k8s manifests..."
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          # kubectl apply -f k8s/ingress.yaml   # Uncomment when Ingress controller is set up

      - name: Update deployment image
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image-tag }}"
          echo "Deploying image: $IMAGE"
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} \
            food-app=$IMAGE \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

      - name: Verify pods are running
        run: |
          echo "Pod status:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=food-app
          echo ""
          echo "Service:"
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "HPA:"
          kubectl get hpa -n ${{ env.K8S_NAMESPACE }}

      - name: Success summary
        if: success()
        run: |
          echo "Deployment complete"
          echo "Image  : ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image-tag }}"
          echo "Commit : ${{ github.sha }}"
          echo "By     : ${{ github.actor }}"
          echo "At     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed -- rolling back..."
          kubectl rollout undo deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }}
          echo "Rollback complete"
