name: 🚀 Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_DIR: /var/www/food-APP
  AWS_REGION: us-east-1        # ← Change to your EC2's region (e.g. ap-south-1)

# OIDC requires these two permissions on the job
permissions:
  id-token: write   # lets GitHub request an OIDC token
  contents: read    # lets actions/checkout read the repo

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Validate static files
  # ─────────────────────────────────────────
  validate:
    name: ✅ Validate HTML & Files
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check required files exist
        run: |
          echo "Checking required project files..."
          files=("index.html" "css/style.css" "css/home.css" "js/app.js" "js/home.js" "data/restaurants.js")
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "  ✅ $file"
            else
              echo "  ❌ MISSING: $file"
              exit 1
            fi
          done
          echo "All required files found!"

      - name: 🔍 Validate HTML files
        run: |
          for html_file in $(find . -name "*.html" -not -path "./.git/*"); do
            if [ ! -s "$html_file" ]; then
              echo "  ❌ Empty file: $html_file"; exit 1
            fi
            if ! grep -q "<!DOCTYPE html>" "$html_file"; then
              echo "  ⚠️  Missing DOCTYPE in: $html_file"
            else
              echo "  ✅ $html_file"
            fi
          done

      - name: 📊 Show file summary
        run: |
          echo "──────────────────────────────"
          echo "HTML: $(find . -name '*.html' -not -path './.git/*' | wc -l) files"
          echo "CSS:  $(find . -name '*.css'  -not -path './.git/*' | wc -l) files"
          echo "JS:   $(find . -name '*.js'   -not -path './.git/*' | wc -l) files"
          echo "Size: $(du -sh . --exclude=.git | cut -f1)"
          echo "──────────────────────────────"

  # ─────────────────────────────────────────
  # JOB 2: Deploy via OIDC + SSM (no SSH keys)
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── OIDC: get short-lived AWS credentials ─────────────────────────
      # Requires your IAM role trust policy to allow this repo.
      # Trust policy "sub" must match: repo:g2rindian2005-cyber/food-App:ref:refs/heads/main
      - name: 🔐 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          role-session-name: GitHubActions-FoodApp-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Verify AWS identity
        run: aws sts get-caller-identity

      # ── Deploy via SSM (port 22 not needed) ───────────────────────────
      - name: 🚀 Deploy to EC2 via SSM
        run: |
          echo "Sending deploy commands to EC2 instance ${{ secrets.EC2_INSTANCE_ID }}..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "FoodApp deploy from GitHub Actions" \
            --parameters commands='[
              "set -e",
              "cd /var/www/food-APP",
              "sudo git fetch origin main",
              "sudo git reset --hard origin/main",
              "sudo chown -R www-data:www-data /var/www/food-APP",
              "sudo chmod -R 755 /var/www/food-APP",
              "sudo nginx -t && sudo systemctl reload nginx",
              "sleep 2",
              "HTTP=$(curl -s -o /dev/null -w \"%{http_code}\" http://localhost); [ \"$HTTP\" = \"200\" ] && echo \"✅ Site UP: $HTTP\" || (echo \"❌ Health check failed: $HTTP\" && exit 1)"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for command to complete on EC2..."

          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "  [$i/30] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment succeeded!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "❌ SSM command failed — Status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
          done

          echo "❌ Timed out waiting for SSM command"
          exit 1

      - name: 🔔 Notify success
        if: success()
        run: |
          echo "✅ Deployed successfully!"
          echo "📅 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 By: ${{ github.actor }}"

      - name: 🚨 Notify failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED!"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 By: ${{ github.actor }}"
