apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-app
  namespace: food-app
  labels:
    app: food-app
spec:
  replicas: 2                        # 2 pods for high availability
  selector:
    matchLabels:
      app: food-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                    # Allow 1 extra pod during update
      maxUnavailable: 0              # Never take pods down before new ones are ready
  template:
    metadata:
      labels:
        app: food-app
    spec:
      containers:
        - name: food-app
          image: YOUR_DOCKERHUB_USERNAME/food-app:latest   # <- update this
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP

          # Resource limits — right-sized for a static site
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          # Liveness probe — restart pod if Nginx stops responding
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          # Readiness probe — only send traffic when pod is ready
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

      # Spread pods across different nodes for resilience
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - food-app
                topologyKey: kubernetes.io/hostname
