apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: food-app-hpa
  namespace: food-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: food-app
  minReplicas: 2              # Always keep at least 2 pods
  maxReplicas: 10             # Scale up to 10 under heavy load
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # Scale up when CPU > 70%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80   # Scale up when memory > 80%
